version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.9
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install --upgrade setuptools wheel
            pip install . pytest
      - run:
          name: Run Pytest
          command: python3 -m pytest
      - run:
          name: Run Smoke Test
          command: python3 scripts/smoke_test.py
      - run:
          name: Generate Verification Artifacts
          command: python3 scripts/generate_verification_status.py --run-checks
      - run:
          name: Generate CircleCI Run Artifacts
          command: python3 scripts/generate_circleci_artifacts.py
      - store_artifacts:
          path: observability/smoke_test.json
          destination: observability/smoke_test.json
      - store_artifacts:
          path: observability/smoke_test.sqlite
          destination: observability/smoke_test.sqlite
      - store_artifacts:
          path: observability/verification.json
          destination: observability/verification.json
      - store_artifacts:
          path: observability/verification.yaml
          destination: observability/verification.yaml
      - store_artifacts:
          path: observability/verification.sqlite
          destination: observability/verification.sqlite
      - store_artifacts:
          path: observability/circleci_run.json
          destination: observability/circleci_run.json
      - store_artifacts:
          path: observability/circleci_run.sqlite
          destination: observability/circleci_run.sqlite

workflows:
  ci:
    jobs:
      - test
