version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.9
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install --upgrade setuptools wheel
            pip install . pytest
      - run:
          name: Run Pytest
          command: python3 -m pytest
      - run:
          name: Run Smoke Test
          command: python3 scripts/smoke_test.py
      - run:
          name: Generate Verification Artifacts
          command: python3 scripts/generate_verification_status.py --run-checks
      - store_artifacts:
          path: observability
          destination: observability

workflows:
  ci:
    jobs:
      - test
